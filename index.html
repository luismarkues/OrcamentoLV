function formatarDataBR(dataString) {
    if (!dataString) return "---";
    // Se a data já vier no formato AAAA-mm-dd (do input date)
    const partes = dataString.split('-');
    if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    return dataString; // Retorna original caso já esteja formatada
}

	function renderInsumosSummary() {
    const container = document.getElementById('insumos-summary-container');
    if (!container) return;

    // 1. Filtrar orçamentos em aberto
    const orcamentosAbertos = state.orcamentos.filter(o => o.status === 'Aberto');
    
    // 2. Consolidar quantitativos de insumos necessários
    const necessidade = {};

    orcamentosAbertos.forEach(o => {
        o.items.forEach(item => {
            const produto = state.produtos.find(p => p.id === item.productId);
            if (produto && produto.composition) {
                produto.composition.forEach(comp => {
                    if (!necessidade[comp.id]) {
                        necessidade[comp.id] = 0;
                    }
                    necessidade[comp.id] += (parseFloat(comp.qty) * parseFloat(item.qty));
                });
            }
        });
    });

    // 3. Preparar dados para exibição (Ordem Alfabética)
    const summaryData = state.insumos.map(insumo => {
        const qtdNecessaria = necessidade[insumo.id] || 0;
        const estoqueAtual = parseFloat(insumo.stock || 0);
        const estoqueMinimo = parseFloat(insumo.minStock || 0);
        
        return {
            nome: insumo.name,
            atual: estoqueAtual,
            necessario: qtdNecessaria,
            minimo: estoqueMinimo,
            insuficiente: estoqueAtual < qtdNecessaria,
            abaixoMinimo: estoqueAtual < estoqueMinimo
        };
    }).sort((a, b) => a.nome.localeCompare(b.nome));

    // 4. Gerar HTML da Tabela
    let html = `
        <div class="card bg-white shadow-md border-t-4 border-blue-600">
            <h3 class="font-bold text-sm mb-3 text-slate-700 uppercase">📊 Necessidade de Insumos (Orçamentos em Aberto)</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-[11px] text-left">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase">
                            <th class="p-2">Insumo</th>
                            <th class="p-2 text-center">Necessário</th>
                            <th class="p-2 text-center">Estoque Atual</th>
                            <th class="p-2 text-center">Mínimo</th>
                        </tr>
                    </thead>
                    <tbody>
    `;

    summaryData.forEach(item => {
        // Se não houver necessidade e o estoque estiver ok, podemos pular ou mostrar zerado
        if (item.necessario <= 0) return;

        const rowClass = item.insuficiente ? 'bg-red-100 text-red-700 font-bold' : '';
        const stockClass = item.abaixoMinimo ? 'text-orange-600 font-bold underline' : '';

        html += `
            <tr class="border-b ${rowClass}">
                <td class="p-2 font-medium">${item.nome}</td>
                <td class="p-2 text-center">${item.necessario.toFixed(2)}</td>
                <td class="p-2 text-center ${formatStock(stockClass)}">${formatStock(item.atual.toFixed(2))}</td>
                <td class="p-2 text-center text-slate-400">${item.minimo.toFixed(2)}</td>
            </tr>
        `;
    });

    html += `
                    </tbody>
                </table>
            </div>
            <p class="text-[9px] text-slate-400 mt-2">* Vermelho: Estoque insuficiente para pedidos / Laranja: Abaixo do mínimo.</p>
        </div>
    `;

    container.innerHTML = html;
}

async function saveCompanyInfo() {
    const name = document.getElementById('conf-comp-name')?.value.trim();
    const phone = document.getElementById('conf-comp-phone')?.value.trim();
    const instagram = document.getElementById('conf-comp-ig')?.value.trim();

    if (!name || !phone) {
        alert("Nome da empresa e telefone são obrigatórios.");
        return;
    }

    const data = {
        name,
        phone,
        instagram
    };

    try {
        await db.ref('company').set(data);
        alert("Dados da empresa salvos com sucesso!");
        location.reload();
    } catch (e) {
        alert("Erro ao salvar dados da empresa: " + e.message);
    }
}

function renderPaymentHistory(o) {
    const historyList = document.getElementById('history-list');
    if (!historyList) return;

    // Cálculos de valores
    const totalOriginal = parseFloat(o.total || 0);
    const totalPago = parseFloat(o.paid || 0);
    const saldoDevedor = totalOriginal - totalPago;

    // 1. Início da Tabela e Valor Inicial
    let html = `
        <div class="bg-white rounded-lg border p-2 mt-2">
            <table class="w-full text-[11px] border-collapse">
                <tbody>
                    <tr class="border-b border-slate-100 bg-slate-50/50">
                        <td class="py-2 px-1 text-slate-600 font-bold">VALOR INICIAL</td>
                        <td class="py-2 px-1 text-right font-black text-slate-800"> ${totalOriginal.toFixed(2)}</td>
                    </tr>
    `;

    // 2. RELAÇÃO DE DIAS DE PAGAMENTO (Inserida entre os totais)
    if (o.paymentsHistory && o.paymentsHistory.length > 0) {
        html += `
            <tr>
                <td colspan="2" class="py-1 px-1 bg-blue-50 text-[9px] font-bold text-blue-700 uppercase tracking-wider">
                    Histórico de Recebimentos
                </td>
            </tr>`;
        
        o.paymentsHistory.forEach(p => {
            html += `
                <tr class="border-b border-slate-50 italic">
                    <td class="py-1.5 px-2 text-blue-600">• ${p.data}
                    <td class="py-1.5 px-1 text-right text-blue-600 font-medium">+  ${parseFloat(p.valor).toFixed(2)}</td>
                </tr>`;
        });
    } else {
        html += `
            <tr>
                <td colspan="2" class="py-2 px-2 text-slate-400 text-center italic border-b border-slate-50">
                    Nenhum pagamento registrado
                </td>
            </tr>`;
    }

    // 3. Finalização com Total Pago e Saldo Devedor
    html += `
                    <tr class="border-t-2 border-slate-100">
                        <td class="py-2 px-1 text-slate-600 font-bold uppercase">Total Pago</td>
                        <td class="py-2 px-1 text-right font-bold text-green-600 underline"> ${totalPago.toFixed(2)}</td>

async function produceBudget(id) {
    const o = state.orcamentos.find(x => x.id === id);
    if (!o) return;
    if (o.status === 'Produzido' || o.status === 'Pago') return alert("Este orçamento já foi produzido ou pago.");

    if (confirm("Deseja marcar como PRODUZIDO? Isso dará baixa automática no estoque dos materiais.")) {
        try {
            // 1. Percorre os itens do orçamento para baixar o estoque
            for (const item of o.items) {
                const produto = state.produtos.find(p => p.id === item.productId);
                if (produto && produto.composition) {
                    for (const comp of produto.composition) {
                        const insumo = state.insumos.find(i => i.id === comp.id);
                        if (insumo) {
                            const novaQtd = (parseFloat(insumo.stock) || 0) - (parseFloat(comp.qty) * item.qty);
                            await db.ref('insumos/' + insumo.id).update({ stock: novaQtd });
                        }
                    }
                }
            }

            // 2. Lógica de Status Automático baseada no saldo devedor
            const totalGeral = parseFloat(o.total || 0);
            const totalPago = parseFloat(o.paid || 0);
            const saldoDevedor = totalGeral - totalPago;

            // Se o saldo for 0 ou menor (ex: pago a mais), vai para "Pago", senão "Produzido"
            const novoStatus = saldoDevedor <= 0.01 ? 'Pago' : 'Produzido';

            // 3. Atualiza no Firebase
            await db.ref('orcamentos/' + id).update({ 
                status: novoStatus,
                produced: true // Mantém a marcação de que já passou pela produção
            });

            alert(novoStatus === 'Pago' ? "Produção registrada! Status alterado para PAGO (Saldo zerado)." : "Produção registrada e estoque atualizado!");
            
        } catch (e) {
            console.error(e);
            alert("Erro ao processar produção.");
        }
    }
}

function calcBudgetTotal() {
    // Soma dos itens considerando o preço unitário já com desconto (se aplicado no modal)
    const itemsTotal = currentItems.reduce((acc, item) => {
        return acc + (parseFloat(item.price || 0) * parseFloat(item.qty || 0));
    }, 0);

    const extra = parseFloat(document.getElementById('budget-extra').value || 0);
    const discount = parseFloat(document.getElementById('budget-discount').value || 0);
    const finalTotal = itemsTotal + extra - discount;

    const display = document.getElementById('total-display');
    if (display) {
        // Criamos um resumo detalhado e alinhado à direita no ecrã
        display.closest('.bg-blue-900').innerHTML = `
            <div class="text-right space-y-1">
                <div class="text-[10px] uppercase opacity-70">Subtotal Itens: R$ ${itemsTotal.toFixed(2)}</div>
                ${extra > 0 ? `<div class="text-[10px] uppercase text-green-300">Acréscimos: + R$ ${extra.toFixed(2)}</div>` : ''}
                ${discount > 0 ? `<div class="text-[10px] uppercase text-red-300">Desconto Global: - R$ ${discount.toFixed(2)}</div>` : ''}
                <div class="text-[10px] uppercase opacity-70 mt-2">Total do Orçamento</div>
                <div class="text-2xl font-black italic">R$ <span id="total-display">${finalTotal.toFixed(2)}</span></div>
            </div>
        `;
    }
    
    return finalTotal;
}

function maskPhone(input) {
    let value = input.value.replace(/\D/g, ""); // Remove tudo o que não é dígito
    
    if (value.length > 11) value = value.slice(0, 11); // Limita a 11 dígitos

    if (value.length > 10) {
        // Formato (00) 00000-0000
        value = value.replace(/^(\22)(\d{5})(\d{4}).*/, "($1) $2-$3");
        // Se preferir o formato (00) 9 0000-0000, use o regex abaixo:
        value = value.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
    } else if (value.length > 5) {
        value = value.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
    } else if (value.length > 2) {
        value = value.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
    } else {
        value = value.replace(/^(\d*)$/, "$1");
    }
    
    input.value = value;
}

	async function processPayment(id) {
    const inputVal = document.getElementById('pay-val');
    const inputMethod = document.getElementById('pay-method');
    if (!inputVal || !id) return;

    const valorPagoAgora = parseFloat(inputVal.value);
    const metodo = inputMethod ? inputMethod.value : "Não informado";
    const dataPagamento = new Date().toLocaleDateString('pt-BR');
    
    // Localiza o orçamento no estado
    const o = state.orcamentos.find(x => x.id === id);
    if (!o) {
        alert("Erro: Orçamento não encontrado.");
        return;
    }

    if (isNaN(valorPagoAgora) || valorPagoAgora <= 0) {
        alert("Digite um valor válido");
        return;
    }

    const historico = o.paymentsHistory || [];
    historico.push({ data: dataPagamento, valor: valorPagoAgora, metodo: metodo });

    const novoPago = (parseFloat(o.paid) || 0) + valorPagoAgora;
    const novoStatus = novoPago >= (o.total - 0.05) ? "Pago" : "Parcial";

    try {
        // Atualiza Orçamento
        await db.ref('orcamentos/' + id).update({
            paid: novoPago,
            status: novoStatus,
            paymentsHistory: historico
        });

        // Lança na Contabilidade (Corrigido o.clientName)
        const accId = db.ref().child('contabilidade').push().key;
        await db.ref('contabilidade/' + accId).set({
            id: accId,
            date: new Date().toISOString().split('T')[0],
            description: `Vr. ref. encomenda ${o.number} - ${o.clientName || 'Cliente'}`,
            type: 'Receita',
            value: valorPagoAgora
        });

        closeModal();
        alert("Pagamento registado com sucesso!");
    } catch (e) {
        alert("Erro ao processar: " + e.message);
    }
}

        const year = dateObj.getFullYear();
        const monthYear = dateObj.toLocaleString('pt-br', { month: 'long', year: 'numeric' }).toUpperCase();

        if (!monthsData[monthYear]) {
            monthsData[monthYear] = { items: [], in: 0, out: 0, year: year };
            monthsOrder.push(monthYear);
        }

        const valorAbs = Math.abs(parseFloat(item.value) || 0);
        if (item.type === 'Receita') {
            monthsData[monthYear].in += valorAbs;
            totalGeralCaixa += valorAbs;
        } else {
            monthsData[monthYear].out += valorAbs;
            totalGeralCaixa -= valorAbs;
        }
        monthsData[monthYear].items.push({...item, valorModulo: valorAbs});

    monthsOrder.forEach((mLabel, index) => {
        const data = monthsData[mLabel];
        const nextMonth = monthsOrder[index + 1];

        totalAnualIn += data.in;

							<td ></td>
                       
                        </tr>
                    </tbody>
                </table>
            </div>
        `;

        // FECHAMENTO ANUAL
        if (!nextYear || nextYear !== data.year) {
            htmlFinal += `
                <div class="mb-8 border-2 border-blue-600 rounded-lg overflow-hidden">
                    <table class="w-full text-[10px] font-bold">
                        <tr class="bg-blue-600 text-white uppercase text-[9px]">

async function updateAllProductsPrices() {
    // Percorre cada produto no estado atual
    for (const produto of state.produtos) {
        if (produto.composition && produto.composition.length > 0) {
            let novoCusto = 0;

            // Recalcula o custo baseado nos preços ATUAIS dos insumos no state
            produto.composition.forEach(comp => {
                const insumoInfo = state.insumos.find(i => i.id === comp.id);
                if (insumoInfo) {
                    novoCusto += parseFloat(comp.qty) * parseFloat(insumoInfo.price);
                }
            });

            // Atualiza o Firebase se o valor mudou
            if (novoCusto !== produto.basePrice) {
                await db.ref('produtos/' + produto.id).update({
                    basePrice: novoCusto,
                    price: novoCusto // Ou aplique sua margem de lucro aqui: novoCusto * 1.3
                });
            }
        }
    }
}

function generateBudgetText(budget) {
    let msg = `*ORÇAMENTO Nº ${budget.number}*\n`;
    msg += `------------------------------------------\n`;
    msg += `*Produtos:*\n`;

    // Percorre os itens para listar um abaixo do outro
    budget.items.forEach(item => {
        const nomeProd = item.name.padEnd(20, ' '); // Completa com espaços até 20 caracteres
        const qtdProd = String(item.qty).padStart(3, ' ');
        const totalProd = item.total.toFixed(2).padStart(10, ' ');
        
        msg += `${nomeProd} | ${qtdProd} un | R$ ${totalProd}\n`;
    });

    msg += `------------------------------------------\n`;
    
    // Alinhamento dos valores finais
    const subtotal = budget.subtotal.toFixed(2).padStart(10, ' ');
    const acrescimo = (budget.addition || 0).toFixed(2).padStart(10, ' ');
    const desconto = (budget.discount || 0).toFixed(2).padStart(10, ' ');
    const totalGeral = budget.total.toFixed(2).padStart(10, ' ');

    msg += `Subtotal:      R$ ${subtotal}\n`;
    if (budget.addition > 0) msg += `Acréscimos:    R$ ${acrescimo}\n`;
    if (budget.discount > 0) msg += `Descontos:     R$ ${desconto}\n`;
    msg += `------------------------------------------\n`;
    msg += `*TOTAL FINAL:  R$ ${totalGeral}*\n\n`;
    msg += `Obrigado pela preferência!`;

    return msg;
}

async function saveInsumo(id = null) {
	
    const name = document.getElementById('ins-name').value;
    const price = parseFloat(document.getElementById('ins-price').value);
    const stock = parseFloat(document.getElementById('ins-stock').value) || 0;
    const unit = document.getElementById('ins-unit').value;
	const minStock = document.getElementById('ins-min').value || 0;
    
	let purchaseDate = document.getElementById('ins-date')?.value;

    // Se não houver data, usa a atual
    if (!purchaseDate) {
        purchaseDate = new Date().toISOString().split('T')[0];
    }

    if (!name || isNaN(price)) {
        alert("Preencha o nome e o preço corretamente!");
        return;
    }

    // CORREÇÃO DO ERRO: Declaração do finalId
   
    const finalId = (id && id !== '' && id !== 'null') ? id : db.ref().child('insumos').push().key;

    const dataInsumo = {
        id: finalId,
        name: name,
        price: price,
        stock: stock,
		minStock: parseFloat(document.getElementById('ins-min').value) || 0,
        unit: unit,
        purchaseDate: purchaseDate
    };

    try {
        // 1. Salva/Atualiza o Insumo
        await db.ref('insumos/' + finalId).set(dataInsumo);

        // 2. LANÇAMENTO DE COMPRA NA CONTABILIDADE
        // Só lança se for um novo registro ou se você clicar em "Compra"
        const accId = db.ref().child('contabilidade').push().key;
        await db.ref('contabilidade/' + accId).set({
            id: accId,

async function processBuyInsumo() {

			const elId = document.getElementById('buy-insumo-id');
			const elQty = document.getElementById('buy-qty');
			const elTotal = document.getElementById('buy-total-value');
			
			// Verifica se os elementos existem antes de ler o .value (Evita o erro de 'null')
			if (!elId ) {
			alert("Erro: Id não carregados corretamente.");
			return;
			}
			if (!elQty ) {
			alert("Erro: Quantidade não carregados corretamente.");
			return;
			}
			if (!elTotal) {
			alert("Erro: Total não carregados corretamente.");
			return;
			}
			
			const id = elId.value;
			const qtyTotal = parseFloat(elQty.value) || 0;
			const valorPagoTotal = parseFloat(elTotal.value) || 0;
			
			const insumo = state.insumos.find(i => i.id === id);
			
			if (!insumo || qtyTotal <= 0 || valorPagoTotal <= 0) {
			alert("Preencha a quantidade e o valor total da compra.");
			return;
			}
			
			const novoValorUnitario = valorPagoTotal / qtyTotal;
			const estoqueAtual = parseFloat(insumo.stock) || 0;
			const novoEstoque = estoqueAtual + qtyTotal;
			
			try {
			// 1. Atualiza o cadastro do Insumo
			await db.ref('insumos/' + id).update({
			   stock: novoEstoque,
			   unitPrice: novoValorUnitario,
			   purchaseDate: getDataAtualISO() // opcional, mas recomendado
			});
			await updateLinkedProducts(id);
			// 2. Registra o Valor Total na Contabilidade como Despesa
			const accId = db.ref().child('contabilidade').push().key;
			await db.ref('contabilidade/' + accId).set({
			   id: accId,

			   description: `Vr. ref. aquis. ${insumo.name} (${qtyTotal})`,
			   type: 'Despesa',
			   value: valorPagoTotal
			});
			
			alert("Compra registrada e estoque atualizado!");
			closeModal();
			} catch (e) {
			alert("Erro ao salvar no banco: " + e.message);

	// Função para atualizar todos os produtos que utilizam um insumo específico
async function updateLinkedProducts(insumoId) {
    if (!state.produtos) return;

    const produtosAfetados = state.produtos.filter(p => 
        p.composition && Array.isArray(p.composition) && p.composition.some(c => c.id === insumoId)
    );

    for (const produto of produtosAfetados) {
        let novoCustoTotal = 0;

        produto.composition.forEach(comp => {
            const insumoInfo = state.insumos.find(i => i.id === comp.id);
            
            // CORREÇÃO AQUI: Forçar conversão para número e usar 0 se for inválido
            const precoUnit = insumoInfo ? parseFloat(insumoInfo.price) : 0;
            const qtd = parseFloat(comp.qty);

            // Verifica se os valores são números válidos antes de somar
            if (!isNaN(precoUnit) && !isNaN(qtd)) {
                novoCustoTotal += qtd * precoUnit;
            }
        });

        // Garantia final: Se por algum motivo o total ainda for NaN, define como 0
        if (isNaN(novoCustoTotal)) novoCustoTotal = 0;

        try {
            // Arredonda para 2 casas decimais para evitar dízimas no banco
            const valorFinal = parseFloat(novoCustoTotal.toFixed(2));

            await db.ref('produtos/' + produto.id).update({
                basePrice: valorFinal,
                price: valorFinal // Ajuste se houver margem de lucro
            });
        } catch (e) {
            console.error("Erro ao atualizar produto: " + produto.name, e);
        }
    }
}

// Função para atualizar todos os produtos que usam um determinado insumo
//++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

async function updateProductsLinkedToInsumo(insumoId) {
    // 1. Localiza o insumo atualizado para obter o novo preço
    const insumo = state.insumos.find(i => i.id === insumoId);
    if (!insumo) return;

    // 2. Filtra produtos que contêm este insumo na composição
    const produtosAfetados = state.produtos.filter(p => 
        p.composition && p.composition.some(item => item.id === insumoId)
    );

    for (const produto of produtosAfetados) {
        let novoCusto = 0;

        // 3. Recalcula o custo total baseado nos preços atuais de TODOS os insumos da composição
        produto.composition.forEach(item => {
            const insData = state.insumos.find(i => i.id === item.id);
            const precoUnitario = insData ? parseFloat(insData.price) : 0;
            novoCusto += parseFloat(item.qty) * precoUnitario;
        });

        // 4. Se você usa uma margem de lucro fixa, pode aplicar aqui. 
        // Caso contrário, atualizamos apenas o preço de custo base.
        try {
            await db.ref('produtos/' + produto.id).update({
                basePrice: novoCusto,
                price: novoCusto // Ou (novoCusto * margem) se tiver margem definida
            });
        } catch (e) {
            console.error("Erro ao atualizar produto " + produto.name, e);
        }
    }
}

async function updateAccounting(id) {
    const data = {
        id: id,
        date: document.getElementById('edit-acc-date').value,
        description: document.getElementById('edit-acc-desc').value,
        type: document.getElementById('edit-acc-type').value,
        value: parseFloat(document.getElementById('edit-acc-val').value)
    };

    if (!data.description || isNaN(data.value)) {
        return alert("Preencha todos os campos corretamente!");
    }

    try {
        await db.ref('contabilidade/' + id).set(data);
        closeModal();
        alert("Lançamento atualizado com sucesso!");
    } catch (e) {
        alert("Erro ao atualizar: " + e.message);
    }
}

async function generateBudgetPDF(id) {
    const o = state.orcamentos.find(x => x.id === id);
    if (!o) return;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // ... (código anterior de cabeçalho e dados do cliente)

    // Tabela de Itens com coluna de desconto por item
    const tableData = o.items.map(item => [
        item.name,
        item.qty.toFixed(2),
        `R$ ${(item.originalPrice || item.price).toFixed(2)}`,
        item.itemDiscount > 0 ? `R$ ${item.itemDiscount.toFixed(2)}` : "-",
        `R$ ${(item.qty * item.price).toFixed(2)}`
    ]);

    doc.autoTable({
        startY: 58,
        head: [['PRODUTO', 'QTD', 'V. UNIT', 'DESC. UN.', 'SUBTOTAL']],
        body: tableData,
        theme: 'striped',
        headStyles: { fillColor: [37, 99, 235], halign: 'center' },
        columnStyles: {
            2: { halign: 'right' },
            3: { halign: 'right' },
            4: { halign: 'right' }
        }
    });

    let finalY = doc.lastAutoTable.finalY + 10;
    const subtotalItens = o.items.reduce((acc, i) => acc + (i.qty * i.price), 0);

    // Bloco de Totais Justificado à Direita
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    
    const posXLabel = 150; // Posição do texto descritivo
    const posXValue = 196; // Posição do valor (alinhado à direita)

    doc.text(`SUBTOTAL ITENS:`, posXLabel, finalY, { align: 'right' });
    doc.text(`R$ ${subtotalItens.toFixed(2)}`, posXValue, finalY, { align: 'right' });
    finalY += 6;

    if (parseFloat(o.extraValue) > 0) {
        doc.setTextColor(0, 128, 0);
        doc.text(`ACRÉSCIMOS (+):`, posXLabel, finalY, { align: 'right' });
        doc.text(`R$ ${parseFloat(o.extraValue).toFixed(2)}`, posXValue, finalY, { align: 'right' });
        finalY += 6;
    }

    if (parseFloat(o.discountValue) > 0) {
        doc.setTextColor(200, 0, 0);
        doc.text(`DESCONTO GLOBAL (-):`, posXLabel, finalY, { align: 'right' });
        doc.text(`R$ ${parseFloat(o.discountValue).toFixed(2)}`, posXValue, finalY, { align: 'right' });
        finalY += 6;
    }

    // Total Final em Destaque
    finalY += 4;
    doc.setDrawColor(37, 99, 235);
    doc.line(130, finalY - 4, 196, finalY - 4);
    
    doc.setFontSize(14);
    doc.setFont(undefined, 'bold');
    doc.setTextColor(37, 99, 235);
    doc.text(`TOTAL GERAL:`, posXLabel, finalY, { align: 'right' });
    doc.text(`R$ ${parseFloat(o.total).toFixed(2)}`, posXValue, finalY, { align: 'right' });

    doc.save(`Orcamento_${o.clientName}.pdf`);
}

async function sendBudgetWhatsApp(id) {
    const o = state.orcamentos.find(b => b.id === id);
    if (!o) {
        alert("Orçamento não encontrado.");
        return;
    }

    // Validação da empresa
    if (!state.company || !state.company.phone) {
        alert("Telefone da empresa não configurado.");
        return;
    }

    const telefone = state.company.phone.replace(/\D/g, '');
    if (!telefone) {
        alert("Telefone inválido.");
        return;
    }

    const linhas = [];

    // Cabeçalho
    linhas.push(`ORÇAMENTO Nº ${o.number}`);
    linhas.push(`Cliente: ${o.clientName || ''}`);
    linhas.push(`--------------------------------`);

    // ===== 1) descobrir maior nome de produto =====
    let maxNomeLen = 0;
    o.items.forEach(item => {
        const produto = state.produtos.find(p => p.id === item.productId);
        const nome = produto ? produto.name : 'Produto';
        if (nome.length > maxNomeLen) {
            maxNomeLen = nome.length;
        }
    });

    // Cabeçalho da tabela
    const tituloProduto = 'PRODUTO';
    const produtoHeader =
        tituloProduto + '-'.repeat(Math.max(0, maxNomeLen - tituloProduto.length));

    linhas.push(`QTD | ${produtoHeader} | VL.UN | TOTAL`);

    // ===== 2) gerar itens com nomes normalizados =====
    o.items.forEach(item => {
        const produto = state.produtos.find(p => p.id === item.productId);
        let nome = produto ? produto.name : 'Produto';

        if (nome.length < maxNomeLen) {
            nome = nome + ' '.repeat(maxNomeLen - nome.length);
        }

        const qtd = item.qty;
        const unit = Number(item.price || 0).toFixed(2);
        const total = (item.qty * item.price).toFixed(2);

        linhas.push(`${qtd} x ${nome} - ${unit} = ${total}`);
    });

    // Rodapé
    linhas.push(`--------------------------------`);
    const extra = parseFloat(o.extraValue || 0);
    const discount = parseFloat(o.discountValue || 0);

    if (extra > 0) {
       linhas.push(`(+) Acréscimos: R$ ${extra.toFixed(2)}\n`);
    }

    if (discount > 0) {
       linhas.push(`(-) Descontos: R$ ${discount.toFixed(2)}\n`);
    }

   linhas.push(`*TOTAL FINAL: R$ ${parseFloat(o.total).toFixed(2)}*\n`);
    
    if (o.obs) {
       linhas.push(`\n*Obs:* ${o.obs}`);
    }
	linhas.push('');
	linhas.push('Obrigado pela preferência!	');
	
	try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(msg);
        } else {
            // Fallback para navegadores mais antigos
            const textArea = document.createElement("textarea");
            textArea.value = msg;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }
    } catch (err) {
        console.error('Erro ao copiar texto: ', err);
    }
    // Conversão para texto estilo .txt (CRLF)
    const textoTxt = linhas.join('\r\n');
	

    // Encode para WhatsApp
    const textoEncoded = encodeURIComponent(textoTxt);

    // URL WhatsApp Web
	const url = `https://wa.me/55${telefone}?text=${textoEncoded}`;
    window.open(url, '_blank');
}
